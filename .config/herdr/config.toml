onboarding = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

[terminal]
# 新規ペインのシェルは fish（$SHELL は zsh のため明示指定）
# herdr は PATH から解決するので、macOS(/opt/homebrew/bin) / Linux(/usr/bin) 共通で書ける
default_shell = "fish"
# macOS では auto でもログインシェルになるが、Linux でも揃えるため明示
shell_mode = "login"

[keys]
# 左手人差し指で押せる ctrl+英字は、fish の peco（ctrl+s/r/b/j/g）と
# readline/vim（ctrl+f=forward-char・画面送り、ctrl+v=quoted-insert・矩形選択）で
# 埋まっていて空きが無い。そこで ghostty 側の ctrl+t> バインドを止めて
# ctrl+t を herdr に譲った（ctrl+q は小指で押しづらいため変更）。
# ghostty 自身の分割・タブは既定の cmd 系を使う。
prefix = "ctrl+t"

# 以下は以前 ghostty の ctrl+t>... に割り当てていたのと同じ指の形。
# c/n/p（タブ）と h/j/k/l（ペイン移動）と z（ズーム）と v（右に分割）は既定のまま一致。
split_horizontal = "prefix+s"   # 下に分割（旧 ghostty の ctrl+t>s。既定は prefix+minus）
settings = "prefix+shift+s"     # s を分割に譲る
close_tab = "prefix+q"          # 旧 ghostty の ctrl+t>q。既定は prefix+shift+x
detach = "prefix+d"             # q を close_tab に譲る（tmux と同じ d）
reload_config = "prefix+r"      # 旧 ghostty の ctrl+t>r。既定は prefix+shift+r
resize_mode = "prefix+shift+r"  # r を reload_config に譲る
